name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: "Jenis build"
        required: true
        default: release
        type: choice
        options:
          - release
          - debug
          - both

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set Android SDK env
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          fi

      - name: Install cmdline-tools if needed & accept licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using SDK at $SDK"
          mkdir -p "$SDK/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$SDK/licenses/android-sdk-license"
          printf '%s\n' \
            "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$SDK/licenses/android-sdk-preview-license"
          SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SM" ]; then
            echo "Downloading cmdline-tools..."
            mkdir -p "$SDK/cmdline-tools"
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            if [ -d "$SDK/cmdline-tools/cmdline-tools" ]; then
              mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            fi
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager=$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create local.properties
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK" > local.properties

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set — APK will not use your release keystore."
            exit 0
          fi
          mkdir -p keystore
          # Strip whitespace/newlines that often corrupt pasted base64 secrets
          echo "$KEYSTORE_BASE64" | tr -d '\n\r\t ' | base64 -d > keystore/hyperisland-release.keystore
          ls -la keystore/hyperisland-release.keystore
          file keystore/hyperisland-release.keystore || true
          # Verify the keystore opens with the provided passwords (fail early with a clear message)
          if [ -n "$KEYSTORE_PASSWORD" ]; then
            ALIAS="${KEYSTORE_ALIAS:-hyperisland}"
            KEY_PW="${KEYSTORE_KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            if ! keytool -list -keystore keystore/hyperisland-release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$ALIAS" >/tmp/ks-list.txt 2>/tmp/ks-err.txt; then
              echo "::error::Keystore cannot be opened. Check KEYSTORE_BASE64, KEYSTORE_PASSWORD, and KEYSTORE_ALIAS."
              echo "keytool stderr:"
              cat /tmp/ks-err.txt
              exit 1
            fi
            echo "Keystore OK. Alias '$ALIAS' is present:"
            cat /tmp/ks-list.txt
            echo "Note: if store password ≠ key password, set secret KEYSTORE_KEY_PASSWORD correctly."
            echo "If they are the same, leave KEYSTORE_KEY_PASSWORD unset (Gradle will reuse KEYSTORE_PASSWORD)."
          fi
          echo "Keystore decoded and verified successfully."

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.6.1"

      - name: Resolve build type
        id: bt
        run: |
          BT="${{ github.event.inputs.build_type }}"
          if [ -z "$BT" ]; then
            BT="release"
          fi
          echo "build_type=$BT" >> $GITHUB_OUTPUT
          echo "Selected build type: $BT"

      - name: Build Release APK
        if: steps.bt.outputs.build_type == 'release' || steps.bt.outputs.build_type == 'both'
        run: |
          for attempt in 1 2 3; do
            echo "Release build attempt $attempt"
            if gradle assembleRelease --stacktrace --no-daemon; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "Release build failed after 3 attempts"
              exit 1
            fi
            echo "Build failed, retrying in 15s..."
            sleep 15
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"
          KEYSTORE_FILE: keystore/hyperisland-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: Build Debug APK
        if: steps.bt.outputs.build_type == 'debug' || steps.bt.outputs.build_type == 'both'
        run: |
          for attempt in 1 2 3; do
            echo "Debug build attempt $attempt"
            if gradle assembleDebug --stacktrace --no-daemon; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "Debug build failed after 3 attempts"
              exit 1
            fi
            echo "Build failed, retrying in 15s..."
            sleep 15
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"
          KEYSTORE_FILE: keystore/hyperisland-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}

      - name: List APK outputs
        if: always()
        run: |
          find app/build/outputs -name "*.apk" 2>/dev/null || echo "No APK found"
          ls -la app/build/outputs/apk/release/ 2>/dev/null || true
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Upload Release APK
        if: steps.bt.outputs.build_type == 'release' || steps.bt.outputs.build_type == 'both'
        uses: actions/upload-artifact@v6
        with:
          name: HyperIslandRoot-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload Debug APK
        if: steps.bt.outputs.build_type == 'debug' || steps.bt.outputs.build_type == 'both'
        uses: actions/upload-artifact@v6
        with:
          name: HyperIslandRoot-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
