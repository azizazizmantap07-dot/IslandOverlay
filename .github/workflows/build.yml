name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set Android SDK env
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-$ANDROID_HOME}" >> $GITHUB_ENV
          # GitHub-hosted ubuntu-latest runners ship with an SDK preinstalled here.
          if [ -z "$ANDROID_HOME" ] || [ ! -d "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
            echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          fi

      - name: Install cmdline-tools if needed & accept licenses
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "Using SDK at $SDK"
          mkdir -p "$SDK/licenses"
          printf '%s\n' \
            "24333f8a63b6825ea9c5514f83c2829b004d1fee" \
            > "$SDK/licenses/android-sdk-license"
          printf '%s\n' \
            "84831b9409646a918e30573bab4c9c91346d8abd" \
            > "$SDK/licenses/android-sdk-preview-license"
          # Find sdkmanager
          SM=$(find "$SDK/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SM" ]; then
            echo "Downloading cmdline-tools..."
            mkdir -p "$SDK/cmdline-tools"
            curl -sL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
            # Google zip extracts to cmdline-tools/cmdline-tools → rename to latest
            if [ -d "$SDK/cmdline-tools/cmdline-tools" ]; then
              mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
            fi
            SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "sdkmanager=$SM"
          yes | "$SM" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true
          "$SM" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Create local.properties
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties

      # Decodes the permanent keystore from a secret so every build — this
      # run and every future run — is signed with the SAME key. That's what
      # lets you `adb install` a new APK straight over the old one without
      # uninstalling first (Android only allows that when the signature
      # matches). Without this step each fresh runner would generate its own
      # throwaway debug keystore and every CI build would have a different
      # signature.
      #
      # One-time setup (repo → Settings → Secrets and variables → Actions):
      #   KEYSTORE_BASE64   = output of: base64 -w0 keystore/hyperisland-debug.keystore
      #   KEYSTORE_PASSWORD = the store/key password
      #   KEYSTORE_ALIAS    = hyperisland   (optional, this is already the default)
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 secret not set — build will fall back to a throwaway auto-generated debug keystore, so this APK will NOT install-over-update the last one. See README for one-time setup."
            exit 0
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/hyperisland-debug.keystore
          echo "Keystore decoded to keystore/hyperisland-debug.keystore"

      # NOTE: this repo does not commit gradlew / gradlew.bat / gradle-wrapper.jar,
      # so `./gradlew` is not available. Rather than generating a wrapper on the fly
      # (which needs a `gradle` binary already on PATH and is fragile), this uses
      # Gradle's own official action to provision a matching Gradle version directly
      # on the runner. It also transparently caches the Gradle distribution and
      # dependencies between runs.
      #
      # If you later commit a real Gradle wrapper (recommended for reproducible local
      # builds too — run `gradle wrapper --gradle-version 8.9` once locally and commit
      # the result), you can remove this step and switch the build step back to
      # `./gradlew assembleDebug`.
      # gradle/actions/setup-gradle occasionally hits a transient
      # "ECONNRESET" while downloading the Gradle distribution/cache
      # (network blip on the runner or on Gradle's servers — not a repo
      # config issue). retry-on-failure wraps just this one step so a
      # flaky connection doesn't fail the whole job; the step itself is
      # unchanged otherwise.
      - name: Set up Gradle 8.9
        uses: Wandalen/wretry.action@v3
        with:
          action: gradle/actions/setup-gradle@v4
          with: |
            gradle-version: 8.9
          attempt_limit: 3
          attempt_delay: 15000

      - name: Build Debug APK
        run: |
          for attempt in 1 2 3; do
            echo "Build attempt $attempt"
            if gradle assembleDebug --stacktrace --no-daemon; then
              break
            fi
            if [ "$attempt" = "3" ]; then
              echo "Build failed after 3 attempts"
              exit 1
            fi
            echo "Build failed, retrying in 15s..."
            sleep 15
          done
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"
          # Read by app/build.gradle.kts signingConfigs. KEYSTORE_FILE is a
          # plain path (relative to repo root) since the keystore was just
          # decoded there in the previous step — same path locally in
          # keystore.properties.
          KEYSTORE_FILE: keystore/hyperisland-debug.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}

      - name: List APK outputs
        if: always()
        run: |
          find app/build -name "*.apk" 2>/dev/null || echo "No APK found"
          ls -la app/build/outputs/apk/debug/ 2>/dev/null || true

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: HyperIslandRoot-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14
